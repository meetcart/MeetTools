<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelScript AI - Viral Reels Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

  <header class="text-center my-6">
    <h1 class="text-3xl font-extrabold text-indigo-400">ReelScript AI</h1>
    <p class="text-slate-400 text-sm mt-1">Instant Viral Hooks, Captions & Hashtags</p>
    <div class="mt-2 inline-block bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-xs text-emerald-400 font-semibold">
      Free Trials Left: <span id="creditsCount">3</span>
    </div>
  </header>

  <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl">
    <div class="space-y-4">
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Niche</label>
        <select id="niche" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:border-indigo-500 focus:outline-none">
          <option value="General Viral">General Viral</option>
          <option value="Tech & AI">Tech & AI</option>
          <option value="Fitness & Health">Fitness & Health</option>
          <option value="Motivation & Psychology">Motivation & Psychology</option>
          <option value="Finance & Money">Finance & Money</option>
        </select>
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Topic / Idea</label>
        <input type="text" id="topic" placeholder="e.g. 3 habits that save money" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:border-indigo-500 focus:outline-none" />
      </div>

      <button id="generateBtn" onclick="generateContent()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition">
        Generate Script & Captions
      </button>
    </div>

    <div id="outputContainer" class="mt-6 hidden">
      <label class="block text-xs uppercase text-slate-400 mb-1 font-semibold">Generated Result</label>
      <div id="output" class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm whitespace-pre-wrap leading-relaxed"></div>
      <button onclick="copyOutput()" class="mt-3 w-full bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded-lg font-semibold">
        Copy All Text
      </button>
    </div>
  </main>

  <div id="paymentModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 text-center space-y-3">
      <h3 class="text-base font-bold text-white">Daily Free Limit Reached!</h3>
      <p class="text-xs text-slate-400">Unlock 100 script generations for just ₹49.</p>
      
      <div class="bg-slate-950 p-3 rounded-xl border border-dashed border-slate-700">
        <p class="text-xs text-slate-400 mb-1">Pay ₹49 to FamPay UPI:</p>
        <p class="font-mono text-xs text-emerald-400 font-bold select-all break-all">fhxlvbfihharmeethlhg@fam</p>
      </div>

      <p class="text-[10px] text-slate-500">Payment karke FamPay transaction ID share karein, unlock ho jayega.</p>
      <button onclick="closeModal()" class="w-full bg-slate-800 text-xs py-2 rounded-lg">Close</button>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6IdrMwebb2P70D4o1MewXyTpM0v9TMLXuz0X-WE5oFrZg";

    let credits = localStorage.getItem('ai_credits') !== null ? parseInt(localStorage.getItem('ai_credits')) : 3;
    document.getElementById('creditsCount').innerText = credits;

    function closeModal() {
      document.getElementById('paymentModal').classList.add('hidden');
    }

    function copyOutput() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text);
      alert("Copied to clipboard!");
    }

    async function generateContent() {
      if (credits <= 0) {
        document.getElementById('paymentModal').classList.remove('hidden');
        return;
      }

      const topic = document.getElementById('topic').value.trim();
      const niche = document.getElementById('niche').value;
      const btn = document.getElementById('generateBtn');

      if (!topic) {
        alert("Please enter a topic first!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Generating...";

      const prompt = `Act as an expert Instagram creator. Generate 3 viral hooks, a crisp caption with line-breaks, and 15 targeted hashtags for a reel about "${topic}" in the niche "${niche}". Keep it high-retention and clean.`;

      try {
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": GEMINI_API_KEY
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const outputText = data.candidates[0].content.parts[0].text;
        document.getElementById('output').innerText = outputText;
        document.getElementById('outputContainer').classList.remove('hidden');

        credits--;
        localStorage.setItem('ai_credits', credits);
        document.getElementById('creditsCount').innerText = credits;
      } catch (err) {
        alert("Error: " + (err.message || "Please try again"));
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate Script & Captions";
      }
    }
  </script>
</body>
</html>
